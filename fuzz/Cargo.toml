[package]
name = "lau-bigfun-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
lau-bigfun = { path = "..", default-features = false, features = ["unpack"] }
libfuzzer-sys = "0.4"

[workspace]

# The crate's own lints (see its Cargo.toml), repeated because this is a separate workspace.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
must_use_candidate = "warn"
missing_errors_doc = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"

[[bin]]
name = "fat_parse"
path = "fuzz_targets/fat_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_read"
path = "fuzz_targets/archive_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filelist_load"
path = "fuzz_targets/filelist_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sanitize_path"
path = "fuzz_targets/sanitize_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "glob_filter"
path = "fuzz_targets/glob_filter.rs"
test = false
doc = false
bench = false
