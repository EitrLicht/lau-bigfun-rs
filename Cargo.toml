[package]
name = "lau-bigfun"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Tomb Raider LAU (Legend, Anniversary, Underworld) bigfile archive reader and unpacker"
license = "MIT"
repository = "https://github.com/EitrLicht/lau-bigfun-rs"
keywords = ["tomb-raider", "bigfile", "archive", "unpacker", "modding"]
categories = ["command-line-utilities", "game-development", "parser-implementations"]
include = ["/src/**", "/tests/**", "/README.md", "/CHANGELOG.md", "/LICENSE", "/SECURITY.md"]

[lib]
name = "lau_bigfun"
path = "src/lib.rs"

[[bin]]
name = "lau-bigfun"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
flate2 = "1.1"
globset = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
thiserror = "2.0"

[features]
default = ["cli"]
cli = ["unpack", "dep:clap", "dep:serde", "dep:serde_json"]
unpack = ["dep:globset"]

[dev-dependencies]
crc32fast = "1.5"

[profile.release]
lto = "thin"
codegen-units = 1


[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
must_use_candidate = "warn"
missing_errors_doc = "warn"
# AGENTS.md's defensive-parsing rule: no silently truncating or sign-changing casts.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
