name: Release

# Builds the standalone Windows executable from a v* tag and leaves it on a draft release, to be
# published by hand. In a public repository the archive and executable are also attested, so
# anyone can verify they were built from the tagged commit by this workflow.
#
# Each job is isolated: `check` validates the tag before anything is built, `build` compiles only
# the crate and its locked dependencies, `notices` runs cargo-about (tooling outside the crate's
# dependency graph) apart from the executable, and `release`, which runs no compiled code, alone
# can attest files or write releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.100.0"
  CARGO_ABOUT_VERSION: "0.9.3"
  TARGET: x86_64-pc-windows-msvc

jobs:
  check:
    name: Check the tag matches the crate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      archive: ${{ steps.version.outputs.archive }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the crate version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow from a v* tag, not the $GITHUB_REF_TYPE '$GITHUB_REF_NAME'"
            exit 1
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the Cargo.toml version $version"
            exit 1
          fi
          echo "archive=lau-bigfun-$GITHUB_REF_NAME-$TARGET" >> "$GITHUB_OUTPUT"

  build:
    name: Build the Windows executable
    needs: check
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Build the standalone executable
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release --target ${{ env.TARGET }}

      - name: Check the executable needs no C runtime DLLs
        shell: pwsh
        run: ./.github/scripts/check-static-crt.ps1 -Path target/${{ env.TARGET }}/release/lau-bigfun.exe

      - name: Upload the executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executable
          path: target/${{ env.TARGET }}/release/lau-bigfun.exe
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  notices:
    name: Generate third-party licence notices
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Generate THIRD-PARTY-LICENSES.txt
        run: |
          cargo install --locked cargo-about --version "$CARGO_ABOUT_VERSION" --features cli
          cargo about generate --locked --fail -c .github/release/about.toml -o THIRD-PARTY-LICENSES.txt .github/release/about.hbs

      - name: Upload the notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: THIRD-PARTY-LICENSES.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  release:
    name: Package, attest and draft the release
    needs: [check, build, notices]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      ARCHIVE: ${{ needs.check.outputs.archive }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: executable
          path: dist

      - name: Download the notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: dist

      - name: Package the release archive
        run: |
          cp LICENSE README.md dist/
          cd dist
          zip -X -j "$ARCHIVE.zip" lau-bigfun.exe LICENSE README.md THIRD-PARTY-LICENSES.txt
          sha256sum "$ARCHIVE.zip" > "$ARCHIVE.zip.sha256"

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/${{ env.ARCHIVE }}.zip
            dist/lau-bigfun.exe

      - name: Note that a private repository is not attested
        if: ${{ github.event.repository.private }}
        run: echo "::notice::Attestation skipped because the repository is private"

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=("dist/$ARCHIVE.zip" "dist/$ARCHIVE.zip.sha256")
          drafts=$(gh release list --limit 1000 --json tagName,isDraft \
            --jq "[.[] | select(.tagName == \"$GITHUB_REF_NAME\")] | map(.isDraft) | @csv")
          case "$drafts" in
            "")
              notes="Standalone Windows x64 executable built from $GITHUB_REF_NAME by the release workflow.

          Verify the download with the GitHub CLI:

              gh attestation verify $ARCHIVE.zip --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml"
              gh release create "$GITHUB_REF_NAME" "${assets[@]}" --draft --verify-tag \
                --title "lau-bigfun $GITHUB_REF_NAME" --notes "$notes"
              ;;
            "true")
              gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
              ;;
            *false*)
              echo "::error::Release $GITHUB_REF_NAME is already published"
              exit 1
              ;;
            *)
              echo "::error::Found several draft releases for $GITHUB_REF_NAME; delete all but one"
              exit 1
              ;;
          esac
